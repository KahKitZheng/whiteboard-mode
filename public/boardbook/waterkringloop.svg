<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1132" viewBox="0 0 1600 1132" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="1600" height="1132" fill="#fbf8f1"/>
  <rect x="0" y="0" width="1600" height="112" fill="#1f6f8b"/>
  <text x="80" y="74" font-size="44" font-weight="600" fill="#fff">3.2  De waterkringloop</text>
  <text x="1380" y="74" font-size="22" fill="#cfe7ef">Aardrijkskunde · groep 7</text>

  <!-- left column -->
  <g fill="#2b2b2b" font-size="21">
    <text x="80" y="180">Water is altijd in beweging. Het verdampt uit de zee, stijgt op als waterdamp,</text>
    <text x="80" y="212">vormt wolken en valt als regen of sneeuw weer naar beneden. Daarna stroomt het</text>
    <text x="80" y="244">via rivieren terug naar de zee. Die rondgang noemen we de waterkringloop.</text>
    <text x="80" y="276">Hij houdt nooit op — het water dat jij vandaag drinkt, was ooit onderdeel van</text>
    <text x="80" y="308">een wolk boven de oceaan.</text>
  </g>
  <text x="80" y="400" font-size="30" font-weight="600" fill="#1f6f8b">Verdamping</text>
  <g fill="#2b2b2b" font-size="21">
    <text x="80" y="440">De zon verwarmt het water in zeeën, meren en rivieren. Een deel van dat water</text>
    <text x="80" y="472">verandert in waterdamp: een gas dat je niet kunt zien. Hoe warmer het is, hoe</text>
    <text x="80" y="504">sneller water verdampt. Ook planten geven waterdamp af via hun bladeren.</text>
  </g>
  <text x="80" y="590" font-size="30" font-weight="600" fill="#1f6f8b">Neerslag</text>
  <g fill="#2b2b2b" font-size="21">
    <text x="80" y="630">Hoog in de lucht is het koud. De waterdamp condenseert tot piepkleine</text>
    <text x="80" y="662">druppeltjes en vormt wolken. Worden de druppels te zwaar, dan vallen ze als</text>
    <text x="80" y="694">regen, hagel of sneeuw naar beneden. Dat heet neerslag.</text>
  </g>
  <rect x="80" y="775" width="230" height="48" rx="10" fill="#e8f0f3" stroke="#1f6f8b" stroke-width="2"/>

  <!-- diagram -->
  <rect x="790" y="140" width="740" height="640" rx="18" fill="#e3f2f8" stroke="#9cc3d2" stroke-width="3"/>
  <circle cx="1420" cy="230" r="58" fill="#f9c74f"/>
  <g stroke="#f9c74f" stroke-width="6" stroke-linecap="round">
    <line x1="1420" y1="140" x2="1420" y2="158"/><line x1="1500" y1="230" x2="1518" y2="230"/>
    <line x1="1478" y1="172" x2="1490" y2="160"/><line x1="1478" y1="288" x2="1490" y2="300"/>
    <line x1="1362" y1="288" x2="1350" y2="300"/>
  </g>
  <path d="M900 250 c-40 0 -60 -40 -30 -60 c0 -50 80 -60 100 -20 c40 -30 100 0 80 40 c40 10 30 60 -10 60 z" fill="#fff" stroke="#8ab6c8" stroke-width="3"/>
  <path d="M1060 210 c-40 0 -60 -40 -30 -60 c0 -50 80 -60 100 -20 c40 -30 100 0 80 40 c40 10 30 60 -10 60 z" fill="#fff" stroke="#8ab6c8" stroke-width="3"/>
  <path d="M1180 700 L1330 420 L1400 540 L1470 460 L1530 700 Z" fill="#7d8f69"/>
  <path d="M1330 420 L1360 470 L1300 470 Z" fill="#fff"/>
  <path d="M800 700 Q 880 680 960 700 T 1120 700 T 1200 700 L1200 780 L800 780 Z" fill="#3a86c8"/>
  <g stroke="#1f6f8b" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M900 660 C 900 560, 920 380, 940 300"/>
    <path d="M1000 210 C 1040 200, 1080 200, 1110 210"/>
    <path d="M1160 260 C 1200 330, 1240 380, 1280 430"/>
    <path d="M1240 690 C 1180 720, 1120 720, 1060 690"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/></marker></defs>
  <g fill="#1f6f8b" font-size="22" font-weight="600">
    <text x="820" y="500">verdamping</text>
    <text x="1000" y="170">condensatie</text>
    <text x="1250" y="330">neerslag</text>
    <text x="1080" y="760">afstroming</text>
  </g>
  <g stroke="#3a86c8" stroke-width="3" stroke-linecap="round">
    <line x1="1200" y1="300" x2="1190" y2="330"/><line x1="1230" y1="300" x2="1220" y2="330"/><line x1="1260" y1="300" x2="1250" y2="330"/>
  </g>

  <!-- assignment -->
  <rect x="80" y="880" width="1450" height="200" rx="14" fill="#fff" stroke="#e0a458" stroke-width="3"/>
  <rect x="80" y="880" width="1450" height="52" rx="14" fill="#e0a458"/>
  <text x="104" y="916" font-size="26" font-weight="600" fill="#fff">Opdracht 3</text>
  <g fill="#2b2b2b" font-size="21">
    <text x="104" y="975">1.  Waardoor verdampt water uit de zee? Schrijf twee oorzaken op.</text>
    <text x="104" y="1015">2.  Leg in je eigen woorden uit wat condensatie is.</text>
    <text x="104" y="1055">3.  Teken de pijl van de kringloop die ontbreekt in de afbeelding.</text>
  </g>
  <text x="1420" y="1112" font-size="16" fill="#8a8a8a">blz. 42</text>
</svg>
